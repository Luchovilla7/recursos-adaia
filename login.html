<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso al contenido</title>
<style>
  :root {
    --bg-color: #0d0d0d;
    --card-bg: #161616;
    --text-color: #f2f2f2;
    --text-muted: #a3a3a3;
    --accent-color: #ffea00;
    --border-color: #3a3a3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-color);
    color: var(--text-color);
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 1.5rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 2.5rem;
    max-width: 380px;
    width: 100%;
  }
  h1 { font-size: 1.3rem; margin: 0 0 .5rem; }
  p.sub { color: var(--text-muted); font-size: .9rem; margin: 0 0 1.5rem; line-height: 1.4; }
  label { display: block; font-size: .85rem; margin-bottom: .4rem; }
  input[type="email"] {
    width: 100%;
    padding: .75rem .9rem;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: #101010;
    color: var(--text-color);
    font-size: 1rem;
    margin-bottom: 1rem;
  }
  input[type="email"]:focus { outline: 2px solid var(--accent-color); }
  button {
    width: 100%;
    padding: .8rem;
    border: none;
    border-radius: 8px;
    background: var(--accent-color);
    color: #000;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .msg { margin-top: 1rem; font-size: .85rem; min-height: 1.2em; }
  .msg.error { color: #ff6b6b; }
  .msg.ok { color: #7bd88f; }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>Acceso al contenido</h1>
    <p class="sub">Ingresá el correo con el que estás registrado en el portal de cliente para entrar.</p>
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" name="email" required autocomplete="email" placeholder="tu@email.com">
    <button type="submit" id="submitBtn">Entrar</button>
    <div class="msg" id="msg"></div>
  </form>

  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');
    const params = new URLSearchParams(window.location.search);
    const next = params.get('next') || '/contenido-redes-ia.html';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      btn.disabled = true;
      msg.textContent = 'Verificando...';
      msg.className = 'msg';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();

        if (res.ok && data.ok) {
          msg.textContent = 'Acceso concedido, redirigiendo...';
          msg.className = 'msg ok';
          window.location.href = next;
        } else {
          msg.textContent = data.message || 'No se pudo verificar el acceso.';
          msg.className = 'msg error';
          btn.disabled = false;
        }
      } catch (err) {
        msg.textContent = 'Error de conexión, intentá de nuevo.';
        msg.className = 'msg error';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
