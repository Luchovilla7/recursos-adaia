<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al contenido</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@1,500;1,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="design-tokens-ailencatriel.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-sans);
            line-height: 1.6;
            padding: 1.5rem;
        }

        h1 {
            font-family: var(--font-serif);
            font-style: italic;
            font-weight: 500;
        }

        .card {
            background: var(--color-surface);
            border: 1px solid var(--color-border-soft);
            border-radius: 22px;
            box-shadow: var(--shadow-soft);
            padding: 2.5rem;
            max-width: 380px;
            width: 100%;
            transition: var(--transition);
        }

        .brand-badge {
            display: inline-block;
            background: var(--color-text);
            color: var(--color-bg);
            padding: 4px 14px;
            font-size: 12px;
            border-radius: 999px;
            font-family: var(--font-sans);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 1.4rem;
        }

        .card h1 {
            font-size: 1.9rem;
            margin-bottom: 0.7rem;
            letter-spacing: -0.01em;
        }

        .card p.sub {
            color: var(--color-text-muted);
            font-size: 0.92rem;
            font-weight: 500;
            margin-bottom: 1.7rem;
            line-height: 1.5;
        }

        label.field-label {
            font-family: var(--font-sans);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--color-text-muted);
            display: block;
            margin-bottom: 0.5rem;
        }

        input[type="email"] {
            width: 100%;
            background: var(--color-bg-alt);
            color: var(--color-text);
            border: 1px solid var(--color-border-soft);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            font-family: var(--font-sans);
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            transition: var(--transition);
            margin-bottom: 1.4rem;
        }

        input[type="email"]:focus {
            border-color: var(--color-text);
            background: var(--color-surface);
        }

        button {
            width: 100%;
            background: var(--color-text);
            color: var(--color-bg);
            border: none;
            border-radius: 999px;
            padding: 0.9rem;
            font-family: var(--font-sans);
            letter-spacing: 0.03em;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: var(--shadow-soft);
            transition: var(--transition);
        }

        button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        button:active:not(:disabled) {
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.55;
            cursor: default;
            transform: none;
        }

        .msg {
            margin-top: 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            min-height: 1.2em;
        }

        .msg.error {
            color: #b3253f;
        }

        .msg.ok {
            color: #2f7a4f;
        }

        .auth-notice {
            display: flex;
            align-items: flex-start;
            gap: 0.7rem;
            background: var(--color-surface-alt);
            border: 1px solid var(--color-border-soft);
            border-radius: 12px;
            padding: 0.9rem 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--color-text);
            line-height: 1.4;
        }

        .auth-notice i {
            color: var(--color-text-muted);
            margin-top: 0.15rem;
            flex-shrink: 0;
        }
    </style>
</head>

<body>

    <form class="card" id="loginForm">
        <span class="brand-badge">ADAIA</span>
        <h1>Acceso a la bóveda de recursos</h1>
        <p class="sub">Ingresá el correo con el que estás registrado en ADAIA para entrar.</p>
        <div class="auth-notice" id="auth-notice" style="display:none;">
            <i class="fas fa-circle-info"></i>
            <span>Necesitás ingresar el correo electrónico con el que adquiriste ADAIA para poder acceder a los
                recursos.</span>
        </div>
        <label class="field-label" for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="tu@email.com">
        <button type="submit" id="submitBtn">Entrar</button>
        <div class="msg" id="msg"></div>
    </form>

    <script>
        const form = document.getElementById('loginForm');
        const msg = document.getElementById('msg');
        const btn = document.getElementById('submitBtn');
        const params = new URLSearchParams(window.location.search);
        const next = params.get('next') || '/recursos.html';

        if (params.get('reason') === 'auth') {
            document.getElementById('auth-notice').style.display = 'flex';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            btn.disabled = true;
            msg.textContent = 'Verificando...';
            msg.className = 'msg';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });
                const data = await res.json();

                if (res.ok && data.ok) {
                    msg.textContent = 'Acceso concedido, redirigiendo...';
                    msg.className = 'msg ok';
                    window.location.href = next;
                } else {
                    msg.textContent = data.message || 'No se pudo verificar el acceso.';
                    msg.className = 'msg error';
                    btn.disabled = false;
                }
            } catch (err) {
                msg.textContent = 'Error de conexión, intentá de nuevo.';
                msg.className = 'msg error';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
