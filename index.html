<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al contenido</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --panel-bg: #f5f5f5;
            --text-color: #000000;
            --text-muted: #555555;
            --accent-color: #ffea00;
            --accent-glow: rgba(255, 234, 0, 0.4);
            --border-color: #000000;
            --input-bg: #ffffff;
            --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        html[data-theme="dark"] {
            --bg-color: #0d0d0d;
            --card-bg: #161616;
            --panel-bg: #1e1e1e;
            --text-color: #f2f2f2;
            --text-muted: #a3a3a3;
            --accent-color: #ffea00;
            --accent-glow: rgba(255, 234, 0, 0.22);
            --border-color: #f2f2f2;
            --input-bg: #101010;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            padding: 1.5rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        h1 { font-family: 'Oswald', sans-serif; text-transform: uppercase; }

        .theme-toggle {
            position: fixed; top: 1.2rem; right: 1.2rem; width: auto;
            display: inline-flex; align-items: center; gap: 0.6rem;
            background: var(--card-bg); color: var(--text-color);
            border: 3px solid var(--border-color); border-radius: 999px;
            padding: 0.4rem 0.9rem; cursor: pointer;
            font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.8rem;
            box-shadow: 3px 3px 0px var(--border-color);
            transition: var(--transition);
        }
        .theme-toggle:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px var(--border-color); }
        .theme-toggle:active { transform: translate(1px, 1px); box-shadow: 2px 2px 0px var(--border-color); }

        .card {
            background: var(--card-bg); border: 3px solid var(--border-color); border-radius: 16px;
            box-shadow: 6px 6px 0px var(--border-color); padding: 2.5rem;
            max-width: 380px; width: 100%;
            transition: var(--transition);
        }

        .brand-badge {
            display: inline-block; background: var(--accent-color); color: #000;
            border: 3px solid var(--border-color); box-shadow: 3px 3px 0px var(--border-color);
            padding: 0.15rem 0.7rem; font-size: 0.75rem; border-radius: 6px;
            font-family: 'Oswald', sans-serif; font-weight: 700; letter-spacing: 1px;
            margin-bottom: 1.2rem;
        }

        .card h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.6rem; }
        .card p.sub { color: var(--text-muted); font-size: 0.9rem; font-weight: 600; margin-bottom: 1.6rem; line-height: 1.5; }

        label.field-label {
            font-family: 'Oswald', sans-serif; font-size: 0.72rem; letter-spacing: 1px;
            text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 0.4rem;
        }

        input[type="email"] {
            width: 100%; background: var(--input-bg); color: var(--text-color);
            border: 2px solid var(--border-color); border-radius: 8px; padding: 0.8rem 0.9rem;
            font-family: 'Montserrat', sans-serif; font-size: 0.95rem; font-weight: 600;
            outline: none; transition: var(--transition); margin-bottom: 1.3rem;
        }
        input[type="email"]:focus { box-shadow: 3px 3px 0px var(--border-color); transform: translate(-1px, -1px); }

        button {
            width: 100%; background: var(--accent-color); color: #000; border: 3px solid var(--border-color);
            border-radius: 10px; padding: 0.85rem; font-family: 'Oswald', sans-serif; letter-spacing: 0.5px;
            font-weight: 700; font-size: 0.95rem; text-transform: uppercase; cursor: pointer;
            box-shadow: 4px 4px 0px var(--border-color); transition: var(--transition);
        }
        button:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--border-color); }
        button:active:not(:disabled) { transform: translate(1px, 1px); box-shadow: 2px 2px 0px var(--border-color); }
        button:disabled { opacity: 0.6; cursor: default; box-shadow: 4px 4px 0px var(--border-color); transform: none; }

        .msg { margin-top: 1rem; font-size: 0.85rem; font-weight: 700; min-height: 1.2em; }
        .msg.error { color: #d1004d; }
        .msg.ok { color: #0a8f4c; }
        html[data-theme="dark"] .msg.error { color: #ff6b6b; }
        html[data-theme="dark"] .msg.ok { color: #7bd88f; }

        .auth-notice {
            display: flex; align-items: flex-start; gap: 0.7rem;
            background: var(--accent-glow); border: 2px solid var(--border-color);
            border-radius: 10px; padding: 0.9rem 1rem; margin-bottom: 1.4rem;
            font-size: 0.85rem; font-weight: 600; color: var(--text-color); line-height: 1.4;
        }
        .auth-notice i { color: #b38f00; margin-top: 0.15rem; flex-shrink: 0; }
        html[data-theme="dark"] .auth-notice i { color: var(--accent-color); }
    </style>
</head>

<body>

    <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">
        <i class="fas fa-moon" id="theme-icon"></i>
        <span id="theme-text">Oscuro</span>
    </button>

    <form class="card" id="loginForm">
        <span class="brand-badge">VAULT</span>
        <h1>Acceso al contenido</h1>
        <p class="sub">Ingresá el correo con el que estás registrado en ADAIA para entrar.</p>
        <div class="auth-notice" id="auth-notice" style="display:none;">
            <i class="fas fa-circle-info"></i>
            <span>Necesitás ingresar el correo electrónico con el que adquiriste ADAIA para poder acceder a los recursos.</span>
        </div>
        <label class="field-label" for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="tu@email.com">
        <button type="submit" id="submitBtn">Entrar</button>
        <div class="msg" id="msg"></div>
    </form>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            if (isDark) {
                icon.className = 'fas fa-moon';
                text.textContent = 'Oscuro';
            } else {
                icon.className = 'fas fa-sun';
                text.textContent = 'Claro';
            }
        }

        const form = document.getElementById('loginForm');
        const msg = document.getElementById('msg');
        const btn = document.getElementById('submitBtn');
        const params = new URLSearchParams(window.location.search);
        const next = params.get('next') || '/recursos.html';

        if (params.get('reason') === 'auth') {
            document.getElementById('auth-notice').style.display = 'flex';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            btn.disabled = true;
            msg.textContent = 'Verificando...';
            msg.className = 'msg';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });
                const data = await res.json();

                if (res.ok && data.ok) {
                    msg.textContent = 'Acceso concedido, redirigiendo...';
                    msg.className = 'msg ok';
                    window.location.href = next;
                } else {
                    msg.textContent = data.message || 'No se pudo verificar el acceso.';
                    msg.className = 'msg error';
                    btn.disabled = false;
                }
            } catch (err) {
                msg.textContent = 'Error de conexión, intentá de nuevo.';
                msg.className = 'msg error';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
